<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beli NOKOS - NOKOS MARKET</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f1020;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #191a2d;
      border: 1px solid #292a40;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #383950;
      background: #10111f;
      color: white;
      outline: none;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      padding: 14px;
      border-radius: 12px;
      background: #10111f;
      color: #aaa;
      margin-top: 15px;
      line-height: 1.5;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin: 12px 0 20px;
    }

    .back {
      display: inline-block;
      color: #aaa;
      text-decoration: none;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <a class="back" href="dashboard.html">
    ← Kembali ke Dashboard
  </a>

  <h1>🛒 Beli NOKOS</h1>

  <p class="subtitle">
    Pilih server, negara dan layanan
  </p>


  <div class="card">

    <label>Server</label>

    <select id="server">
      <option value="">Pilih server</option>
    </select>


    <label>Negara</label>

    <select id="country">
      <option value="">Pilih negara</option>
    </select>


    <label>Layanan</label>

    <select id="service">
      <option value="">Pilih layanan</option>
    </select>


    <div class="price" id="price">
      Rp 0
    </div>

    <button id="checkButton">
      Cek Produk
    </button>

    <div class="status" id="status">
      Silakan pilih produk.
    </div>

  </div>

</div>


<script>

const API =
  "https://nokos-market-production.up.railway.app";


const serverSelect =
  document.getElementById("server");

const countrySelect =
  document.getElementById("country");

const serviceSelect =
  document.getElementById("service");

const priceElement =
  document.getElementById("price");

const statusElement =
  document.getElementById("status");

const checkButton =
  document.getElementById("checkButton");


let providerPrices = [];


/* Format Rupiah */

function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(value || 0);

}


/* Status */

function status(message) {

  statusElement.textContent =
    message;

}


/* LOAD SERVICES */

async function loadServices() {

  try {

    status("Menghubungkan ke Railway...");

    const response =
      await fetch(
        `${API}/api/provider/services`
      );


    const result =
      await response.json();


    console.log(result);


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal mengambil service"
      );

    }


    /*
      Kita tampilkan service
      yang diberikan provider.
    */

    const data =
      result.data;


    serviceSelect.innerHTML =
      `<option value="">Pilih layanan</option>`;


    /*
      Jika API mengembalikan array.
    */

    if (Array.isArray(data)) {

      data.forEach(item => {

        const option =
          document.createElement("option");

        option.value =
          item.id ??
          item.service ??
          item.code ??
          "";

        option.textContent =
          item.name ??
          item.service ??
          item.title ??
          option.value;

        serviceSelect.appendChild(
          option
        );

      });

    }


    status(
      "Service berhasil dimuat."
    );


  } catch (error) {

    console.error(error);

    status(
      "Gagal mengambil service: " +
      error.message
    );

  }

}


/* CHECK PRICE */

async function checkPrice() {

  const service =
    serviceSelect.value;

  const country =
    countrySelect.value;

  const server =
    serverSelect.value;


  if (!service) {

    status(
      "Pilih layanan terlebih dahulu."
    );

    return;

  }


  try {

    status("Mengambil harga...");


    const params =
      new URLSearchParams({

        service,
        country,
        server

      });


    const response =
      await fetch(
        `${API}/api/provider/prices?${params}`
      );


    const result =
      await response.json();


    console.log(result);


    if (!result.success) {

      throw new Error(
        result.message ||
        "Harga tidak ditemukan"
      );

    }


    providerPrices =
      result.data;


    /*
      Tampilkan hasil mentah sementara.
      Nanti kita sesuaikan setelah
      melihat format response provider.
    */

    let price = 0;


    if (Array.isArray(providerPrices)) {

      const first =
        providerPrices[0];

      price =
        Number(
          first?.price ??
          first?.harga ??
          first?.cost ??
          0
        );

    } else if (
      typeof providerPrices === "object"
    ) {

      price =
        Number(
          providerPrices.price ??
          providerPrices.harga ??
          providerPrices.cost ??
          0
        );

    }


    priceElement.textContent =
      rupiah(price);


    status(
      "Harga berhasil diambil dari backend Railway."
    );


  } catch (error) {

    console.error(error);

    status(
      "Gagal mengambil harga: " +
      error.message
    );

  }

}


checkButton.addEventListener(
  "click",
  checkPrice
);


/*
  Untuk tahap pertama kita
  isi contoh pilihan negara.
  Nanti negara akan diambil
  langsung dari database/provider.
*/

const countries = [

  {
    code: "ID",
    name: "Indonesia"
  },

  {
    code: "US",
    name: "United States"
  },

  {
    code: "MY",
    name: "Malaysia"
  }

];


countries.forEach(country => {

  const option =
    document.createElement("option");

  option.value =
    country.code;

  option.textContent =
    country.name;

  countrySelect.appendChild(
    option
  );

});


/*
  Server sementara.
  Nanti kita sesuaikan dengan
  server yang tersedia provider.
*/

const servers = [

  {
    id: "1",
    name: "Server 1"
  }

];


servers.forEach(server => {

  const option =
    document.createElement("option");

  option.value =
    server.id;

  option.textContent =
    server.name;

  serverSelect.appendChild(
    option
  );

});


loadServices();

</script>

</body>
    </html>
